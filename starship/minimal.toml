# Starship Prompt Configuration
# https://starship.rs/config/

# 프롬프트 포맷
format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$direnv\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# 명령어 실행 시간 표시 (2초 이상)
[cmd_duration]
min_time = 2_000
format = " [$duration]($style)"

# 디렉토리
[directory]
truncation_length = 3
truncate_to_repo = true

# Git branch
[git_branch]
format = " [$symbol$branch(:$remote_branch)]($style)"
symbol = " "

# Git status
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

# Kubernetes
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = "☸ "

# direnv
[direnv]
disabled = false
format = '[$symbol](dimmed yellow)$loaded/$allowed '
symbol = ""
loaded_msg = "[loaded](dimmed green)"
unloaded_msg = "[not loaded](dimmed yellow)"
allowed_msg = "[allowed](dimmed green)"
not_allowed_msg = "[not allowed](dimmed red)"
denied_msg = "[denied](bold red)"

# Python
[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "

# Node.js
[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "

# Go
[golang]
format = "[$symbol($version )]($style)"
symbol = " "

# Rust
[rust]
format = "[$symbol($version )]($style)"
symbol = " "

# Docker context
[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
only_with_files = true

# 불필요한 cloud 모듈 비활성화
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

# 프롬프트 캐릭터
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
