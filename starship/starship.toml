# Starship 프롬프트: Catppuccin Macchiato powerline, 세그먼트 2줄
#   첫째 줄: 시스템 정보. 배경 없이 선으로 틀을 그린다 (a3chron 의 Stellar ctp-blue 에서 착안)
#   둘째 줄: 작업 정보 (빨강 → 주황 → 노랑 → 초록 → 하늘)
# 공식 프리셋 catppuccin-powerline 의 색 순서를 따르고 모듈을 조정했다.
# Nerd Font 가 필요하다. 아이콘 없는 단순한 프롬프트는 minimal.toml 에 있다.
#   전환: ~/.zshrc.local 에  export STARSHIP_CONFIG=~/dotFiles/starship/minimal.toml
# 색 조합 바꾸기: 아래 palette 를 catppuccin_mocha / frappe / latte 로 바꾼다.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](overlay0) $username$hostname$localip\
[──](overlay0) $shell \
[──](overlay0) ${custom.cpu} [─](overlay0) $memory_usage [─](overlay0) ${custom.disk} \
$battery\
[──╌╌](overlay0) $time
[│](overlay0) \
[](red)\
$os\
[](fg:red bg:peach)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$python\
$nodejs\
$bun\
$golang\
$rust\
$java\
[](fg:green bg:sapphire)\
$kubernetes\
$docker_context\
$direnv\
[ ](fg:sapphire)\
$cmd_duration\
$line_break\
[╰─](overlay0) $character"""

palette = 'catppuccin_macchiato'

# 외부 명령(git 등)이 느린 저장소에서 프롬프트가 멈추지 않게 한다
command_timeout = 1000

# --- 첫째 줄: 시스템 정보. 배경 없이 선과 색 글자만 쓴다 ---
[username]
show_always = true
style_user = "bold teal"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = "ssh:"
trim_at = "."
format = "[@$ssh_symbol](bold dimmed maroon)[$hostname](bold sapphire) "

# 네트워크가 없으면 통째로 사라진다
[localip]
disabled = false
ssh_only = false
format = "[$localipv4](dimmed blue) "

[shell]
disabled = false
style = "bold green"
format = "[$indicator]($style)"
zsh_indicator = "zsh"
bash_indicator = "bash"
fish_indicator = "fish"
unknown_indicator = "sh"

# CPU: 1분 평균 부하를 코어 수로 나눈 비율. 순간 사용률은 측정에 1초가 걸려 쓰지 않는다.
# custom 모듈은 프롬프트마다 명령을 실행한다(각 10ms 안팎).
[custom.cpu]
description = "1분 평균 부하 / 코어 수"
when = true
shell = ["sh"]
command = '''n=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1); if [ -r /proc/loadavg ]; then l=$(cut -d" " -f1 /proc/loadavg); else l=$(LC_ALL=C uptime | sed "s/.*load averages*: *//; s/,//g" | cut -d" " -f1); fi; awk -v l="$l" -v n="$n" 'BEGIN { printf "%d%%", (l / n) * 100 }' '''
format = "[CPU](bold peach) [$output](peach)"

[memory_usage]
disabled = false
threshold = -1
format = "[RAM](bold mauve) [$ram_pct](mauve)"

# 디스크: 루트 볼륨 사용률. macOS 는 사용자 데이터가 있는 볼륨을 본다.
[custom.disk]
description = "루트 볼륨 사용률"
when = true
shell = ["sh"]
command = """d=/; [ -d /System/Volumes/Data ] && d=/System/Volumes/Data; df -P "$d" | awk 'NR==2 { print $5 }'"""
format = "[DISK](bold yellow) [$output](yellow)"

# 배터리가 없는 머신에서는 구분선까지 통째로 사라진다
[battery]
format = "[─](overlay0) [$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 100
style = "teal"

[time]
disabled = false
time_format = "%R"
format = "[$time](bold flamingo)"

# --- 둘째 줄: 작업 정보 ---
[os]
disabled = false
style = "bg:red fg:crust"

# 구버전 starship(Debian 13 의 1.22 등)도 아는 이름만 둔다
[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
Raspbian = "󰐿 "
Macos = "󰀵 "
Linux = "󰌽 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Arch = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:crust bg:green)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kubernetes]
disabled = false
symbol = "☸"
style = "bg:sapphire"
format = '[[ $symbol $context( \($namespace\)) ](fg:crust bg:sapphire)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'
only_with_files = true

[direnv]
disabled = false
symbol = "direnv"
style = "bg:sapphire"
format = '[[ $symbol $loaded ](fg:crust bg:sapphire)]($style)'
loaded_msg = "on"
unloaded_msg = "off"

# 2초 이상 걸린 명령의 실행 시간
[cmd_duration]
min_time = 2_000
format = "[ $duration ](fg:yellow)"

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'

# 쓰지 않는 cloud 모듈
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

