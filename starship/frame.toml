# Starship 프롬프트: 선으로 틀을 그린 3줄 구성 (Catppuccin)
# a3chron 의 "blue" 테마(Stellar 의 ctp-blue)를 바탕으로 모듈을 조정했다.
#   원본: https://github.com/a3chron/starship-theme-switcher  (MIT License, Copyright (c) 2025 a3chron)
# 배경색을 쓰지 않고 선 문자만 쓰므로 Nerd Font 가 없어도 된다.
#   전환: ~/.zshrc.local 에  export STARSHIP_CONFIG=~/dotFiles/starship/frame.toml
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_macchiato'

format = """
[╭─ $shell─────────────── $memory_usage ──╌╌ $python$nodejs$golang$rust$kubernetes$direnv $fill ╌╌─╮](overlay0)
[├╌](overlay0)$sudo$username$hostname $directory$read_only$git_branch$git_metrics [$fill $cmd_duration ┘](overlay0)
[╰─ $battery $character](overlay0) """

scan_timeout = 10
command_timeout = 1000
add_newline = true

[shell]
fish_indicator = 'fish'
zsh_indicator = 'zsh'
bash_indicator = 'bash'
unknown_indicator = 'unknwn'
style = 'teal'
disabled = false

[username]
style_user = 'teal bold'
format = ' [$user]($style)'
disabled = false
show_always = true

[sudo]
format = ' [sudo](bold red)'
disabled = false

[python]
symbol = ''
format = '[Python](bold mauve) [$version [\($virtualenv\)](dimmed mauve)](dimmed mauve)'
pyenv_version_name = true
detect_files = ['requirements.txt', '__init.py__', 'setup.py']
detect_extensions = ['py']
detect_folders = []

[nodejs]
format = '[Node](bold lavender) [$version](bold dimmed lavender) '

[golang]
format = '[Go](bold lavender) [$version](bold dimmed lavender) '

[memory_usage]
disabled = false
threshold = -1
format = '[$ram_pct]($style)'
symbol = ''
style = 'dimmed blue'

[hostname]
ssh_only = true
ssh_symbol = 'ssh:'
format = '[@$ssh_symbol](bold dimmed maroon)[$hostname](bold dimmed sapphire)'
trim_at = ''
disabled = false

[git_metrics]
disabled = false
format = ' [+$added](bold teal)[-$deleted](bold pink)'

[git_branch]
format = '[$branch(:$remote_branch)]($style)'
style = 'bold pink'

[fill]
symbol = ' '
style = 'bold base'

# time of command
[cmd_duration]
min_time = 2_000
format = ' [$duration](bold dimmed flamingo)'

[directory]
fish_style_pwd_dir_length = 5
disabled = false
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' read-only'
read_only_style = 'bold dimmed mauve'
style = 'bold mauve'

# prompt char
[character]
success_symbol = '[──╌╌](overlay0)'
error_symbol = '[──╌╌](red)'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# battery
[battery]

full_symbol = '● '
charging_symbol = '◉ '
discharging_symbol = '◯ '

[[battery.display]]
threshold = 20
style = 'red'

[[battery.display]]
threshold = 100
style = 'teal'

[rust]
format = '[Rust](bold peach) [$version](bold dimmed peach) '

[kubernetes]
disabled = false
format = '[k8s](bold blue) [$context( \($namespace\))](bold dimmed blue) '

[direnv]
disabled = false
format = '[direnv](bold yellow) [$loaded](bold dimmed yellow) '
loaded_msg = 'on'
unloaded_msg = 'off'

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

